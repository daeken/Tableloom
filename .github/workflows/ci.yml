name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Node 24 checks and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Strict checks, tests, builds and production smoke
        run: npm run check
      - name: Source-free runtime and backup recovery
        run: node --import tsx scripts/runtime-check.ts

  container:
    name: Linux container persistence
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Build and verify isolated container recovery
        run: npm run container:check
      - name: Validate nginx hosting example
        run: npm run proxy:check
